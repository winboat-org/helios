[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
windres = 'windres'
pkg-config = 'pkgconf'
ninja = 'ninja'

[built-in options]
# MSYS2's static libregex is a thin wrapper over libtre, which in turn uses
# gettext and iconv. Mesa detects regex with find_library(), so it does not
# learn about that static dependency chain.
c_link_args = ['-static', '-static-libgcc', '-ltre', '-lintl', '-liconv']
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++', '-ltre', '-lintl', '-liconv']
