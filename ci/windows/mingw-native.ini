[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
windres = 'windres'
pkg-config = 'pkgconf'
ninja = 'ninja'

[built-in options]
# MSYS2's static libregex is a thin wrapper over libtre. Mesa detects regex
# with find_library(), so it does not learn about that transitive dependency.
c_link_args = ['-static', '-static-libgcc', '-ltre']
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++', '-ltre']
