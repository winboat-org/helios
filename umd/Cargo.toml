[package]
name = "helios_umd"
version = "0.1.0"
edition = "2021"
description = "Helios vGPU WDDM user-mode display driver bring-up DLL."

[lib]
crate-type = ["cdylib"]

[dependencies]
cxx = "1"
helios_protocol = { path = "../protocol" }
# `Win32_Graphics_Direct3D_Fxc` is deliberately ABSENT (T6/R909): it pulls
# `D3DCompile` -- an HLSL runtime compiler -- into a shipped display-driver DLL.
# Its only user was the deleted in-process selftest. Re-adding it means shipping
# a compiler in the UMD; say why in the commit that does.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[build-dependencies]
cxx-build = "1"
bindgen = "0.70"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = "thin"
opt-level = 2
# Full debug info: the minidump symbolization workflow (dump_syms +
# minidump-stackwalk) requires a GUID-matched PDB for the deployed DLL.
debug = "full"
