name: Build Helios drivers
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      root_revision:
        description: Committed winboat-devenv source and pins (40 hex characters)
        required: true
        type: string
      component_revision:
        description: Exact component commit; must equal this workflow SHA
        required: true
        type: string
      configuration:
        required: true
        type: choice
        options: [release, debug]
      engine_selection:
        description: Four exact DXVK and vkd3d artifact selectors as JSON
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: component-${{ github.workflow }}-${{ github.sha }}-${{ inputs.root_revision }}-${{ inputs.configuration || 'release' }}
  cancel-in-progress: false
jobs:
  prepare-inputs:
    if: github.repository == 'winboat-org/helios'
    environment: component-build
    runs-on: ubuntu-24.04
    outputs:
      root_revision: ${{ steps.identity.outputs.root_revision }}
      component_revision: ${{ steps.identity.outputs.component_revision }}
      configuration: ${{ steps.identity.outputs.configuration }}
      prepared-id: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [helios-guest-x64]
    steps:
      - name: Resolve and record immutable build identities
        id: identity
        env:
          SELECTED_ROOT: ${{ inputs.root_revision }}
          SELECTED_COMPONENT: ${{ inputs.component_revision }}
          SELECTED_CONFIGURATION: ${{ inputs.configuration }}
          GH_TOKEN: ${{ secrets.COMPONENT_INPUTS_TOKEN || github.token }}
        run: |
          root_revision="$SELECTED_ROOT"
          if [[ -z "$root_revision" ]]; then
            root_branch=$(gh api repos/winboat-org/winboat-devenv --jq .default_branch)
            root_revision=$(gh api "repos/winboat-org/winboat-devenv/commits/$root_branch" --jq .sha)
          fi
          component_revision="${SELECTED_COMPONENT:-$GITHUB_SHA}"
          configuration="${SELECTED_CONFIGURATION:-release}"
          [[ "$root_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$component_revision" =~ ^[0-9a-f]{40}$ ]]
          test "$component_revision" = "$GITHUB_SHA"
          [[ "$configuration" = release || "$configuration" = debug ]]
          printf 'root_revision=%s\ncomponent_revision=%s\nconfiguration=%s\n' "$root_revision" "$component_revision" "$configuration" >> "$GITHUB_OUTPUT"
          printf 'Root: %s\nComponent: %s\nConfiguration: %s\n' "$root_revision" "$component_revision" "$configuration" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout the exact root operation and installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          repository: winboat-org/winboat-devenv
          ref: ${{ steps.identity.outputs.root_revision }}
          path: workspace
          persist-credentials: false
          submodules: false
          token: ${{ secrets.COMPONENT_INPUTS_TOKEN || github.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2, composite
        with:
          enable_kvm: false
          extra_nix_config: |
            max-jobs = 1
            cores = 2
      - name: Realize the component command
        working-directory: workspace
        run: |
          component_tools=$(nix build --no-link --print-out-paths --file nix/ci.nix component)
          printf '%s/bin\n' "$component_tools" >> "$GITHUB_PATH"
      - name: Restore immutable source-object cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, node24
        with:
          path: workspace/.state/source-cache
          key: component-${{ runner.os }}-${{ steps.identity.outputs.root_revision }}-${{ steps.identity.outputs.component_revision }}-${{ hashFiles('workspace/devenv.lock', 'workspace/config/provision.lock.json', 'workspace/nix/pins.nix') }}-${{ matrix.target }}-${{ steps.identity.outputs.configuration }}
      - name: Fetch this component and its canonical pinned dependencies
        working-directory: workspace
        env:
          OWNER: 'helios'
          TARGET: ${{ matrix.target }}
          COMPONENT_REVISION: ${{ steps.identity.outputs.component_revision }}
          ROOT_REVISION: ${{ steps.identity.outputs.root_revision }}
          CONFIGURATION: ${{ steps.identity.outputs.configuration }}
          GH_TOKEN: ${{ secrets.COMPONENT_INPUTS_TOKEN || github.token }}
        run: >-
          wb-component-build --phase sync --owner "$OWNER" --target "$TARGET"
          --source-revision "$COMPONENT_REVISION" --root-revision "$ROOT_REVISION"
          --configuration "$CONFIGURATION"
      - name: Build the repository-owned artifact through Nix operations
        working-directory: workspace
        env:
          OWNER: 'helios'
          TARGET: ${{ matrix.target }}
          COMPONENT_REVISION: ${{ steps.identity.outputs.component_revision }}
          ROOT_REVISION: ${{ steps.identity.outputs.root_revision }}
          CONFIGURATION: ${{ steps.identity.outputs.configuration }}
          ENGINE_SELECTION: ${{ inputs.engine_selection }}
          GH_TOKEN: ${{ secrets.COMPONENT_INPUTS_TOKEN || github.token }}
        run: >-
          wb-component-build --owner "$OWNER" --target "$TARGET"
          --source-revision "$COMPONENT_REVISION" --root-revision "$ROOT_REVISION"
          --configuration "$CONFIGURATION" --phase prepare --engine-selection "$ENGINE_SELECTION"
      - name: Upload this run's individual artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: driver-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/out/ci-driver-inputs/driver-inputs.zip
            workspace/out/ci-driver-inputs/driver-request.json
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 30
      - name: Record exact hosted artifact identity
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: printf '%s %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
  compile-driver:
    name: Compile and sign the driver
    needs: prepare-inputs
    runs-on: windows-2025
    timeout-minutes: 180
    outputs:
      compiled-id: ${{ steps.compiled.outputs.artifact-id }}
    steps:
      - name: Checkout the exact shared Windows build operation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          repository: winboat-org/winboat-devenv
          ref: ${{ needs.prepare-inputs.outputs.root_revision }}
          persist-credentials: false
          token: ${{ secrets.COMPONENT_INPUTS_TOKEN || github.token }}
      - name: Download this run's exact verified inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, node24
        with:
          artifact-ids: ${{ needs.prepare-inputs.outputs.prepared-id }}
          path: out/prepared
          merge-multiple: true
      - name: Build with the verified portable toolchain
        shell: pwsh
        run: ./nix/windows/HostedDriver.ps1 -PreparedDirectory out/prepared -OutputDirectory out/compiled
      - name: Retain the compiler output and receipt
        id: compiled
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: compiled-driver-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/compiled/
          compression-level: 1
          if-no-files-found: error
          retention-days: 3
  verify-artifact:
    name: Verify and publish the driver artifact
    needs: [prepare-inputs, compile-driver]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the exact verification operation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          repository: winboat-org/winboat-devenv
          ref: ${{ needs.prepare-inputs.outputs.root_revision }}
          path: workspace
          persist-credentials: false
          token: ${{ secrets.COMPONENT_INPUTS_TOKEN || github.token }}
      - name: Download the exact preparation receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, node24
        with:
          artifact-ids: ${{ needs.prepare-inputs.outputs.prepared-id }}
          path: workspace/out/prepared
          merge-multiple: true
      - name: Download the exact compiler output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, node24
        with:
          artifact-ids: ${{ needs.compile-driver.outputs.compiled-id }}
          path: workspace/out/compiled
          merge-multiple: true
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2, composite
        with:
          enable_kvm: false
      - name: Verify and normalize the already compiled artifact
        working-directory: workspace
        env:
          ROOT_REVISION: ${{ needs.prepare-inputs.outputs.root_revision }}
          COMPONENT_REVISION: ${{ needs.prepare-inputs.outputs.component_revision }}
          CONFIGURATION: ${{ needs.prepare-inputs.outputs.configuration }}
          GH_TOKEN: ${{ secrets.COMPONENT_INPUTS_TOKEN || github.token }}
        run: |
          component_tools=$(nix build --no-link --print-out-paths --file nix/ci.nix component)
          "$component_tools/bin/wb-component-build" --owner helios --target helios-guest-x64 --phase seal \
            --root-revision "$ROOT_REVISION" --source-revision "$COMPONENT_REVISION" --configuration "$CONFIGURATION" \
            --prepared-dir out/prepared --compiled-dir out/compiled
      - name: Upload the individual verified driver artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: helios-guest-x64-${{ needs.prepare-inputs.outputs.configuration }}-${{ needs.prepare-inputs.outputs.component_revision }}
          path: workspace/out/ci-components/helios-guest-x64-${{ needs.prepare-inputs.outputs.configuration }}/
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 30
