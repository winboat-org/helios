[package]
name = "helios_umd12"
version = "0.1.0"
edition = "2021"
description = "Helios vGPU WDDM D3D12 user-mode display driver (skeleton; OpenAdapter12 refuses)."

[lib]
# The second cdylib. `DECISIONS.md` D3: `helios_umd.dll` keeps
# `UserModeDriverName` slots 0-2, `helios_umd12.dll` takes slot 3.
#
# Why two DLLs and not one: `helios_umd.dll` is loaded AND UNLOADED once per
# D3D11 device create inside dwm (measured). Linking vkd3d + dxil-spirv into the
# compositor's driver would make DWM pay, on every device create, for a feature
# it never uses. Two DLLs also give the only acceptable rollback -- slot 3 is a
# single registry rewrite away from disabling D3D12 with D3D11 provably
# untouched.
crate-type = ["cdylib"]

[dependencies]
# ⛔ The D3b rule: anything that would also exist in `umd/` lives here, not in a
# second copy. Nothing in this crate may be copy-pasted from `umd/`.
helios_umd_common = { path = "../umd_common" }
# S4: the cxx bridge to the STATICALLY LINKED vkd3d engine. Same major version
# as `umd`'s (`umd/Cargo.toml:11`) on purpose -- both cdylibs compile the same
# shared `umd_common/bridge/*.h` against the cxx runtime, and two cxx majors in
# one tree would mean two `cxxbridge1` link names and two sets of glue.
cxx = "1"
# ⛔ `Win32_Graphics_Direct3D_Fxc` is deliberately ABSENT, for the same reason it
# is absent from `umd` (T6/R909): it pulls `D3DCompile`, an HLSL runtime
# compiler, into a shipped display-driver DLL. vkd3d takes raw DXIL from the
# runtime (`dx12-p1-contract-captured-73rd`: shaders arrive as DXIL, never
# DXBC), so nothing here needs a compiler.
#
# ⚠ `ARCHITECTURE.md` §5's feature list for this crate predates S4 and does not
# list `Win32_Graphics_Direct3D12`; S4 adds it because `bridge12.rs` types the
# bridge's borrowed/owned device handles as `ID3D12Device` rather than a bare
# `usize`. Deviation recorded here rather than silently taken.
#
# ⛔ `Win32_System_Diagnostics_Debug` is GONE, and its absence is checked by the
# compiler rather than by this comment. It was `OutputDebugStringA`'s home, used
# by the pre-S4 hand-rolled `OpenAdapter12` refusal path; S4 deleted that path in
# favour of the shared `helios_umd_common` log + `RefusalCounter`, so the last
# reference went with it. Verified by removing the feature and re-running the
# host cross-check clean -- a feature nothing imports is a dependency surface
# carried for no reason.
# ⚠ `Win32_Graphics_Dxgi_Common` is L1's addition and it is NOT a DXGI
# dependency. The `Win32_Graphics_Dxgi_Common` module of the `windows` crate
# contains no `#[link]` block and no `extern "system"` declaration of any kind --
# it is `DXGI_FORMAT`, `DXGI_SAMPLE_DESC` and their siblings, pure types with no
# entry points. It is required because `D3D12_FEATURE_DATA_FORMAT_SUPPORT` and
# `D3D12_FEATURE_DATA_MULTISAMPLE_QUALITY_LEVELS` -- the two structs
# `ID3D12Device::CheckFeatureSupport` takes for the queries `pfnCheckFormatSupport`
# and `pfnCheckMultisampleQualityLevels` forward -- carry a `DXGI_FORMAT` field
# and are `#[cfg(feature = "Win32_Graphics_Dxgi_Common")]` behind it.
#
# ⛔ The rule it must not break: `helios_umd12.dll` imports **no `dxgi.dll`**
# (the rule is stated at `umd/build.rs:252-256`; it is `D12-G1`'s pass
# criterion, and `tmp/dx12/build-g1-*.ps1` check it with `dumpbin /IMPORTS`).
# A type-only feature cannot add an import; that is why this one is acceptable
# where a `Win32_Graphics_Dxgi` feature would not be. ⚠ Measured on the release
# build that introduced it: the import list is unchanged from S4 --
# api-ms-win-*, ADVAPI32, KERNEL32, oleaut32, ntdll, MSVCP140, VCRUNTIME140{,_1},
# GDI32 -- with no dxgi.dll and no d3d12.dll.
#
# ⚠ The alternative was rejected on `ARCHITECTURE.md` §12 rule 1: hand-writing a
# `#[repr(C)]` copy of the two feature-data structs would be transcribing an ABI
# by hand, which is exactly what R908 cost. These come out of the same Win32
# metadata generator as `ID3D12Device` itself.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }

[build-dependencies]
# S3: bindgen `d3d12umddi.h` with `layout_tests(true)`. The layout assertions
# ARE the deliverable -- if this crate compiles, the D3D12 DDI ABI is
# machine-checked against the SDK header. Same bindgen version as `umd`, so both
# drivers' generated ABI comes out of one code generator.
bindgen = "0.70"

# S4: compiles `bridge/vkd3d_bridge.cpp` + the cxx glue with clang-cl and links
# the engine. ⭐ The link set is MEASURED, not a guess (`D12-G1` static arm,
# `tmp/dx12/gates/G1-static/RESULT.md`): `libhelios_d3d12_static.a` + `gdi32`,
# ONE archive because meson makes it a union of every vkd3d / dxil-spirv /
# dxbc-spirv object. ⛔ Never `dxgi` -- a WDDM UMD sits below DXGI.
cxx-build = "1"

# ⛔ The standing rule that still shapes this crate (`DECISIONS.md` §7.1):
# `OpenAdapter12` must stop refusing IN THE SAME COMMIT that makes its body
# reachable -- or the body must not be written yet. S4 adds the engine bridge
# and a set of `helios_umd12_probe_*_v1` test-only exports; it does NOT make
# `OpenAdapter12` reachable, and that entry point still returns
# `DXGI_ERROR_UNSUPPORTED`. R908 deleted ~230 lines of unreachable D3D12
# scaffolding hidden behind `#[allow(unreachable_code)]`; that is the standing
# record of what ignoring this costs.

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = "thin"
opt-level = 2
# Full debug info, matching `umd`: the minidump symbolization workflow
# (dump_syms + minidump-stackwalk) requires a GUID-matched PDB for the deployed
# DLL.
debug = "full"
