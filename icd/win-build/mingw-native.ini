# Meson native file for building the Mesa venus ICD with mingw-w64 gcc on win11.
# RECOMMENDED toolchain (validated 2026-06-05): gcc compiles 100% of venus with
# zero Mesa edits + only the helios_win_compat.h forced-include, and builds
# straight from the Z:\ share (no robocopy mirror). See icd/PHASE5_HANDOVER.md §6.
#
# Toolchain: WinLibs UCRT mingw-w64 gcc 16.1.0, installed via
#   winget install --id BrechtSanders.WinLibs.POSIX.UCRT --exact
# The build wrapper prepends WinLibs' mingw64/bin directory to PATH. Keep these
# as command names so the native file is not tied to one Windows user profile or
# to Winget's package-directory layout.
[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
windres = 'windres'
pkg-config = 'pkgconf'
ninja = 'ninja'

[built-in options]
c_link_args = ['-static', '-static-libgcc']
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++']
