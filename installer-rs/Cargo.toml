[package]
name = "helios-setup"
version = "0.1.0"
edition = "2021"
description = "Helios vGPU self-contained Windows installer"
publish = false

[[bin]]
name = "HeliosSetup"
path = "src/main.rs"

[dependencies]
# Raw Win32 FFI, deliberately: the installer must run on Microsoft Basic
# Display before any GPU driver exists, so no GPU/GL-backed GUI framework.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Shutdown",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }
sha2 = "0.10"
# Solid LZMA2 for the payload container: ~30% smaller than deflate and the whole
# payload is extracted anyway, so there is no per-file random access to preserve.
xz2 = "0.1"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"
opt-level = 1
