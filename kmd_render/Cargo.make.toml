# cargo-make driver build, per windows-drivers-rs. `cargo make` packages the
# .sys + .inf (+ test cert) into target/<profile>/package/.
# wdk-build's load_rust_driver_makefile writes rust-driver-makefile.toml to
# `${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/` (hardcoded `target/`, it
# does NOT honor CARGO_TARGET_DIR). So this stays the default `target/...`.
# IMPORTANT: build from a LOCAL disk (C:\), never the Z:\ share — Rust file IO
# (this very copy) fails on the 9p/virtio share with OS error 87. See TOOLCHAIN.md.
extend = "target/rust-driver-makefile.toml"

# Single source of truth for the driver version (HELIOS_KMD_VERSION), shared with
# kmd_render/build.rs and tools/win-mcp. Consumed by [tasks.stampinf] below.
#
# This is a TOP-LEVEL cargo-make key, NOT a [config] key: cargo-make silently
# ignores an unknown key inside [config], and the failure mode is stampinf
# receiving the literal "${HELIOS_KMD_VERSION}" and rejecting it with "version
# string must have exactly 4 fields". Resolved relative to the working directory,
# and both win_build_kmd and win_cargo do `Set-Location ...\kmd_render` before
# invoking cargo make.
env_files = ["./driver-version.env"]

[config]
load_script = '''
#!@rust
//! ```cargo
//! [dependencies]
//! wdk-build = "0.5"
//! ```
#![allow(unused_doc_comments)]
wdk_build::cargo_make::load_rust_driver_makefile()?
'''

# Builds BOTH user-mode drivers and stages them into the driver package.
#
# helios_umd.dll   — D3D9/10/11, DXVK-backed. UserModeDriverName slots 0-2.
# helios_umd12.dll — D3D12, vkd3d-backed.     UserModeDriverName slot 3.
#
# ⛔ helios_umd12.dll is staged here because stage S5 put it in the INF's
# [SourceDisksFiles] and [Helios_CopyFiles]. An INF that names a file the
# package does not contain fails the install — loudly, but after the build — so
# the two edits are one change and belong in one commit.
#
# PREREQUISITE: this task cannot succeed without a prior `win_dxvk` build AND a
# prior `win_vkd3d` build. umd/build.rs links libhelios_d3d11_static.a /
# libdxvk.a / ... out of C:\Users\Rupansh\dxvk-build; umd12/build.rs links
# libhelios_d3d12_static.a out of C:\Users\Rupansh\vkd3d-build. A missing or
# stale engine build fails here, in the inner cargo build, not in kmd_render.
#
# NOTE: whatever this task stages for helios_umd.dll is overwritten by
# install-helios-kmd.ps1's Sync-HeliosPackageUmd ($UmdDll, release by default)
# before the catalog is created and signed. This task decides what a bare
# `cargo make` packages; the install script decides what actually reaches the
# DriverStore. Keep the two profiles in agreement or the package hash moves
# between build and install.
#
# ⚠ There is no Sync-HeliosPackageUmd equivalent for helios_umd12.dll, so the
# D3D12 UMD that reaches the DriverStore is exactly what THIS task built, at
# THIS task's profile. That asymmetry is deliberate for now — the D3D12 kill
# switch is off by default, so the packaged D3D12 binary changes nothing until
# someone sets UmdD3D12 — but it means a cold-boot D3D12 experiment must
# re-run `cargo make`, not just re-run the installer with a different -UmdDll.
[tasks.copy-umd-to-package]
private = true
dependencies = ["copy-driver-binary-to-package", "copy-inf-to-package"]
script_runner = "@rust"
script = '''
use std::path::PathBuf;
use std::process::Command;

let kmd_dir = PathBuf::from(std::env::var("CARGO_MAKE_WORKING_DIRECTORY").unwrap());
let repo = kmd_dir.parent().unwrap().to_path_buf();

// One source of truth for the profile, used for the inner build's flag, the UMD
// source directory and the package destination — previously all three were the
// hardcoded string "debug", so a `cargo make --profile production` built release
// and then copied a stale debug DLL.
let cargo_profile =
    std::env::var("CARGO_MAKE_CARGO_PROFILE").unwrap_or_else(|_| "dev".to_string());
// cargo's `dev` profile writes to target/debug; every other profile uses its own
// name as the directory.
let profile_dir = if cargo_profile == "dev" { "debug" } else { cargo_profile.as_str() };

let package = kmd_dir
    .join("target")
    .join(profile_dir)
    .join("helios_kmd_render_package");
std::fs::create_dir_all(&package).unwrap();

// (crate directory, produced DLL, the engine build whose absence is the usual
// cause of a failure in the inner build). Both entries are required: the INF's
// [SourceDisksFiles] / [Helios_CopyFiles] name both files as of S5, so a package
// missing either one fails the install.
let umds = [
    ("umd",   "helios_umd.dll",   "DXVK build in C:\\Users\\Rupansh\\dxvk-build (run win_dxvk first)"),
    ("umd12", "helios_umd12.dll", "vkd3d build in C:\\Users\\Rupansh\\vkd3d-build (run win_vkd3d first)"),
];

for (crate_name, dll_name, engine_hint) in umds {
    let crate_dir = repo.join(crate_name);

    let mut build = Command::new("cargo");
    build.arg("build").current_dir(&crate_dir);
    match cargo_profile.as_str() {
        "dev" => {}
        "release" => { build.arg("--release"); }
        other => { build.arg("--profile").arg(other); }
    }
    let status = build
        .status()
        .unwrap_or_else(|e| panic!("launch cargo build for {crate_name}: {e}"));
    assert!(
        status.success(),
        "{crate_name} build failed (profile {cargo_profile}); a missing or stale {engine_hint} \
         is the usual cause"
    );

    let source = crate_dir.join("target").join(profile_dir).join(dll_name);
    // Loud failure over a stale copy: CARGO_TARGET_DIR set in the environment sends
    // the inner build's output elsewhere, in which case `source` is either absent or
    // a leftover from an older build and the package would ship it silently.
    assert!(
        source.exists(),
        "{dll_name} not found at {} after a successful build (profile {cargo_profile}) — \
         CARGO_TARGET_DIR set in the environment redirects the inner cargo build's output",
        source.display()
    );
    let destination = package.join(dll_name);
    std::fs::copy(&source, &destination).unwrap_or_else(|e| {
        panic!("copy {} -> {}: {e}", source.display(), destination.display())
    });
}
'''

# Rust/link.exe toolchain revisions have emitted the /MAP output in both
# target/<profile>/deps and the crate's hashed build/.../out directory. Search
# those two compiler-owned locations explicitly (never the package directory)
# and copy the newest map so an old packaged artifact cannot win discovery.
[tasks.copy-map-to-package]
private = true
dependencies = ["build"]
script_runner = "@rust"
script = '''
use std::path::{Path, PathBuf};
use std::time::SystemTime;

fn collect_maps(dir: &Path, maps: &mut Vec<(SystemTime, PathBuf)>) {
    let Ok(entries) = std::fs::read_dir(dir) else { return };
    for entry in entries.flatten() {
        let path = entry.path();
        if path.is_dir() {
            collect_maps(&path, maps);
        } else if path.file_name().is_some_and(|name| name == "helios_kmd_render.map") {
            let modified = entry
                .metadata()
                .and_then(|metadata| metadata.modified())
                .unwrap_or(SystemTime::UNIX_EPOCH);
            maps.push((modified, path));
        }
    }
}

let kmd_dir = PathBuf::from(std::env::var("CARGO_MAKE_WORKING_DIRECTORY").unwrap());
let cargo_profile =
    std::env::var("CARGO_MAKE_CARGO_PROFILE").unwrap_or_else(|_| "dev".to_string());
let profile_dir = if cargo_profile == "dev" { "debug" } else { cargo_profile.as_str() };
let target_dir = kmd_dir.join("target").join(profile_dir);
let mut maps = Vec::new();
collect_maps(&target_dir.join("deps"), &mut maps);
collect_maps(&target_dir.join("build"), &mut maps);
let source = maps
    .into_iter()
    .max_by_key(|(modified, _)| *modified)
    .map(|(_, path)| path)
    .expect("linker map not found below target/<profile>/{deps,build} after successful driver build");
let package = target_dir.join("helios_kmd_render_package");
std::fs::create_dir_all(&package).unwrap();
let destination = package.join("helios_kmd_render.map");
std::fs::copy(&source, &destination).unwrap_or_else(|error| {
    panic!("copy {} -> {}: {error}", source.display(), destination.display())
});
println!("cargo-make: copied linker map {}", source.display());
'''

# A panic in any Helios DDI is a KeBugCheck (panic = "abort" + wdk-panic), i.e.
# a silent graphics deadlock or a stop, so the crate must contain no runtime
# panic source of the unwrap/expect class. R601 removed the last six; this keeps
# them gone.
#
# It is a packaging-time task, not a build.rs check, deliberately: build.rs would
# have to declare `rerun-if-changed=src`, which re-runs bindgen and the resource
# compile on every source edit. Gating the packaged image is what matters — that
# is the artifact that ships. `#![deny(clippy::unwrap_used, clippy::expect_used)]`
# in lib.rs covers the same ground under `cargo clippy`.
#
# Line comments are stripped before matching so the prose may name the pattern.
# Truncating at the first `//` can in principle hide a `.unwrap()` that appears
# after a `//` INSIDE a string literal; no such string exists in this crate, and
# the alternative is a Rust lexer in a build task.
[tasks.verify-no-panics]
script_runner = "@rust"
script = '''
use std::path::{Path, PathBuf};

fn scan(dir: &Path, hits: &mut Vec<String>) {
    let entries = std::fs::read_dir(dir).unwrap_or_else(|e| panic!("read_dir {dir:?}: {e}"));
    for entry in entries {
        let path = entry.expect("dir entry").path();
        if path.is_dir() {
            scan(&path, hits);
        } else if path.extension().is_some_and(|e| e == "rs") {
            let text = std::fs::read_to_string(&path)
                .unwrap_or_else(|e| panic!("read {path:?}: {e}"));
            for (n, line) in text.lines().enumerate() {
                let code = match line.find("//") {
                    Some(i) => &line[..i],
                    None => line,
                };
                if code.contains(".unwrap()") || code.contains(".expect(") {
                    hits.push(format!("{}:{}: {}", path.display(), n + 1, line.trim()));
                }
            }
        }
    }
}

let src = PathBuf::from(std::env::var("CARGO_MAKE_WORKING_DIRECTORY").unwrap()).join("src");
let mut hits = Vec::new();
scan(&src, &mut hits);
if !hits.is_empty() {
    for h in &hits {
        println!("cargo-make: panicking call site: {h}");
    }
    panic!(
        "{} panicking call site(s) in kmd_render/src. A panic in a DDI is a \
         KeBugCheck; return a documented NTSTATUS and count the refusal instead. \
         See REFACTOR_REVIEW.md R601.",
        hits.len()
    );
}
println!("cargo-make: no unwrap/expect call sites in kmd_render/src");
'''

[tasks.stampinf]
private = true
command = "stampinf"
args = [
  "-f", "${WDK_BUILD_OUTPUT_DIRECTORY}/${CARGO_MAKE_CRATE_FS_NAME}.inf",
  "-d", "*",
  "-a", "amd64",
  "-c", "${CARGO_MAKE_CRATE_FS_NAME}.cat",
  # Stamps the INF DriverVer. Must equal the .sys FILEVERSION that build.rs
  # renders from the same file — a mismatch is FAILED_ADD 0xc0000182 at install.
  "-v", "${HELIOS_KMD_VERSION}",
]

[tasks.inf2cat]
private = true
dependencies = [
  "verify-no-panics",
  "copy-driver-binary-to-package",
  "copy-inf-to-package",
  "copy-umd-to-package",
]
env = { "WDK_BUILD_INF2CAT_OS" = { source = "${CARGO_MAKE_CRATE_TARGET_TRIPLE}", default_value = "UNKNOWN", mapping = { "x86_64-pc-windows-msvc" = "10_x64", "aarch64-pc-windows-msvc" = "Server10_arm64" } } }
command = "inf2cat"
args = [
  "/driver:${WDK_BUILD_OUTPUT_DIRECTORY}/${CARGO_MAKE_CRATE_FS_NAME}_package",
  "/os:${WDK_BUILD_INF2CAT_OS}",
  "/uselocaltime",
]
